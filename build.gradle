plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def coreProject = project(':core')
def mediaWorkerProject = project(':media-worker')
evaluationDependsOn(':core')
evaluationDependsOn(':media-worker')

sourceSets {
    gameTest {
        java.setSrcDirs(['src/gameTest/java'])
        resources.setSrcDirs(['src/gameTest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
    // Test-only agent mod (otetv_smoketest): drives a dev client into a fresh flat world, plays the bundled demo on a
    // placed TV, saves screenshots and smoketest-result.json, then quits. Used by runClient -PsmokeTest. Never shipped.
    smokeTest {
        java.setSrcDirs(['src/smokeTest/java'])
        resources.setSrcDirs(['src/smokeTest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    smokeTestImplementation.extendsFrom implementation
    smokeTestRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
        }

        client {
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source coreProject.sourceSets.main
                }
            }
            if (project.hasProperty('smokeTest')) {
                property 'otetv.smoketest.output', file('run/smoketest').absolutePath
                if (project.hasProperty('smokeYouTube')) {
                    // A YouTube video id; the browser runtime comes from runtime-packaging/package_browser_worker.py.
                    property 'otetv.smoketest.youtube', project.property('smokeYouTube')
                    property 'otetv.smoketest.browserBundles', file('runtime-packaging/out').absolutePath
                }
                mods { otetv_smoketest { source sourceSets.smokeTest } }
            }
        }

        server {
            workingDirectory project.file('run-server')
            args '--nogui'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source coreProject.sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source coreProject.sourceSets.main
                    source sourceSets.gameTest
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source coreProject.sourceSets.main
                }
            }
        }
    }
}

// The media worker is embedded in the mod jar outside assets/ and data/, so neither a resource pack nor a
// datapack can replace executable code. Its SHA-256 is recorded next to it and re-verified before each launch.
def workerResourcesDir = layout.buildDirectory.dir('generated/workerResources')
def stageWorkerResources = tasks.register('stageWorkerResources') {
    def workerJarTask = mediaWorkerProject.tasks.named('workerJar')
    dependsOn workerJarTask
    inputs.file(workerJarTask.flatMap { it.archiveFile })
    outputs.dir(workerResourcesDir)
    doLast {
        def jarFile = workerJarTask.get().archiveFile.get().asFile
        def outDir = new File(workerResourcesDir.get().asFile, 'otetv_workers')
        project.delete(outDir)
        outDir.mkdirs()
        def staged = new File(outDir, 'otetv-media-worker.jar')
        java.nio.file.Files.copy(jarFile.toPath(), staged.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        staged.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int read
            while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
        }
        def hex = digest.digest().collect { String.format('%02x', it) }.join()
        new File(outDir, 'workers.properties').text =
                "media.file=otetv-media-worker.jar\nmedia.sha256=${hex}\nmedia.size=${staged.length()}\nmedia.version=${mod_version}\nmedia.protocol=1\n"
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir workerResourcesDir
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn stageWorkerResources
    exclude '.cache'
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('processSmokeTestResources', ProcessResources).configure {
    def agentProperties = [loader_version_range: loader_version_range, mod_license: mod_license, mod_version: mod_version,
                           mod_authors: mod_authors, mod_id: mod_id]
    inputs.properties agentProperties
    filesMatching('META-INF/mods.toml') { expand agentProperties }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // core is compiled separately (no Minecraft on its classpath, which enforces the boundary) and is merged
    // into this mod: dev runs list its output as a mod source above, and the jar task copies its classes.
    compileOnly coreProject
}

tasks.named('jar', Jar).configure {
    from(coreProject.sourceSets.main.output)
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// Gate A: common and server code must never import client rendering, browser, GStreamer, AWT, or native
// loaders. A class is resolved as soon as it is referenced, so an `isClientSide` guard does not help.
// The client package is exempt; ClientHooks is the single bridge, reached only through DistExecutor.
// Datagen is exempt because Forge's model generators live in a client-named package and only run in runData.
def checkSideBoundaries = tasks.register('checkSideBoundaries') {
    def srcDir = file('src/main/java')
    inputs.dir(srcDir)
    doLast {
        def forbidden = ['net.minecraft.client.', 'com.mojang.blaze3d.', 'net.minecraftforge.client.', 'java.awt.',
                         'javax.swing.', 'javax.sound.', 'org.lwjgl.', 'org.freedesktop.gstreamer.', 'org.cef.',
                         'com.sun.jna.', 'com.otectus.otetv.client.']
        def allowed = ['com.otectus.otetv.client.ClientHooks']
        def violations = []
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (!f.name.endsWith('.java')) return
            def rel = srcDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
            if (rel.startsWith('com/otectus/otetv/client/') || rel.startsWith('com/otectus/otetv/datagen/')) return
            f.eachLine { line, n ->
                def trimmed = line.trim()
                if (trimmed.startsWith('//') || trimmed.startsWith('*') || trimmed.startsWith('/*')) return
                forbidden.each { prefix ->
                    int idx = trimmed.indexOf(prefix)
                    while (idx >= 0) {
                        def tail = trimmed.substring(idx)
                        def symbol = (tail =~ /^[\w.]+/)[0]
                        boolean precededByWordChar = idx > 0 && (Character.isJavaIdentifierPart(trimmed.charAt(idx - 1)) || trimmed.charAt(idx - 1) == ('.' as char))
                        if (!precededByWordChar && !allowed.any { symbol.startsWith(it) }) {
                            violations << "${rel}:${n}: ${symbol}"
                        }
                        idx = trimmed.indexOf(prefix, idx + prefix.length())
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Client-only or native references in common code:\n  " + violations.unique().join('\n  '))
        }
    }
}

tasks.named('check').configure {
    dependsOn checkSideBoundaries
    dependsOn coreProject.tasks.named('test')
}

tasks.named('compileJava').configure {
    finalizedBy checkSideBoundaries
}
